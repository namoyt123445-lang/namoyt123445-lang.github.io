<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PokeRogue Eon - Admin</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0b1020; color:#e8ecf4; margin:0; padding:24px; }
  h1 { margin:0 0 16px; }
  .card { background:#151b33; border:1px solid #2a335a; border-radius:10px; padding:16px; margin-bottom:16px; }
  .row { display:flex; gap:12px; flex-wrap:wrap; }
  .stat { background:#1f2747; padding:12px 16px; border-radius:8px; min-width:120px; }
  .stat .v { font-size:24px; font-weight:700; }
  .stat .l { font-size:12px; opacity:.7; }
  input { padding:8px 10px; border-radius:6px; border:1px solid #2a335a; background:#0b1020; color:#e8ecf4; }
  button { padding:8px 14px; border-radius:6px; border:none; background:#4f6cff; color:#fff; cursor:pointer; }
  button:hover { background:#6a84ff; }
  table { width:100%; border-collapse:collapse; }
  th,td { padding:8px 10px; border-bottom:1px solid #2a335a; text-align:left; font-size:13px; }
  th { background:#1f2747; }
  .online { color:#6bff9a; }
  .offline { color:#888; }
  .admin { color:#ffd166; }
  #login { max-width:360px; }
  .hidden { display:none; }
  .err { color:#ff6b6b; margin-top:8px; }
</style>
</head>
<body>
<h1>PokeRogue Eon - Admin Dashboard</h1>
<div id="login" class="card">
  <h3>Login (NamoYT admin account)</h3>
  <div class="row">
    <input id="u" placeholder="username" value="NamoYT">
    <input id="p" type="password" placeholder="password">
    <button id="loginBtn">Login</button>
  </div>
  <div id="loginErr" class="err"></div>
</div>
<div id="panel" class="hidden">
  <div class="card">
    <div class="row" id="stats"></div>
    <button id="refresh" style="margin-top:12px;">Refresh</button>
    <button id="logout" style="margin-top:12px;background:#666;">Logout</button>
  </div>
  <div class="card"><h3>Online now</h3><div id="online"></div></div>
  <div class="card"><h3>Registered users</h3><div id="users"></div></div>
  <div class="card"><h3>Events</h3><div id="events"></div></div>
</div>
<script>
const API = "https://pokerogue-eon-api.namoy-eon.workers.dev";
let token = localStorage.getItem("eon_admin_token") || "";
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function api(path){const r=await fetch(API+path,{headers:{Authorization:token}});const t=await r.text();let j;try{j=JSON.parse(t);}catch{}return{status:r.status,text:t,json:j};}
async function doLogin(){const u=document.getElementById("u").value.trim();const p=document.getElementById("p").value;const r=await fetch(API+"/account/login",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({username:u,password:p})});const t=await r.text();if(!r.ok){document.getElementById("loginErr").textContent=t||"login failed";return;}const j=JSON.parse(t);token=j.token;localStorage.setItem("eon_admin_token",token);showPanel();}
async function showPanel(){document.getElementById("login").classList.add("hidden");document.getElementById("panel").classList.remove("hidden");await refresh();}
async function refresh(){
  const st=await api("/admin/stats");if(st.status===403){alert("Not an admin account");return;}
  const s=st.json;document.getElementById("stats").innerHTML=`<div class="stat"><div class="v">${s.totalUsers}</div><div class="l">Total users</div></div><div class="stat"><div class="v">${s.onlineNow}</div><div class="l">Online now</div></div><div class="stat"><div class="v">${s.totalBattles}</div><div class="l">Battles</div></div><div class="stat"><div class="v">${s.dailyScoresToday}</div><div class="l">Daily scores today</div></div>`;
  const on=await api("/admin/online");const op=on.json;document.getElementById("online").innerHTML=op.count===0?"<i>none</i>":`<table><tr><th>Username</th><th>Last seen</th></tr>`+op.players.map(p=>`<tr><td>${esc(p.username)}</td><td>${new Date(p.lastSeen*1000).toLocaleTimeString()}</td></tr>`).join("")+`</table>`;
  const us=await api("/admin/users");const u=us.json;document.getElementById("users").innerHTML=`<table><tr><th>Username</th><th>Created</th><th>Last seen</th><th>Status</th><th>Admin</th></tr>`+u.users.map(x=>`<tr><td>${esc(x.username)}</td><td>${new Date(x.createdAt*1000).toLocaleDateString()}</td><td>${new Date(x.lastSeen*1000).toLocaleString()}</td><td class="${x.online?'online':'offline'}">${x.online?'online':'offline'}</td><td class="${x.isAdmin?'admin':''}">${x.isAdmin?'yes':'no'}</td></tr>`).join("")+`</table>`;
  const ev=await api("/admin/events");const e=ev.json;document.getElementById("events").innerHTML=`<table><tr><th>Event</th><th>Multiplier</th><th>Status</th><th>Toggle</th></tr>`+e.events.map(x=>`<tr><td>${esc(x.name)} <small>(${esc(x.id)})</small></td><td>${x.multiplier}x</td><td class="${x.enabled?'online':'offline'}">${x.enabled?'ON':'off'}</td><td><button onclick="toggleEvent('${esc(x.id)}',${!x.enabled})">${x.enabled?'Disable':'Enable'}</button></td></tr>`).join("")+`</table>`;
}
async function toggleEvent(id,enabled){await fetch(API+"/admin/events/toggle",{method:"POST",headers:{Authorization:token,"Content-Type":"application/json"},body:JSON.stringify({id,enabled})});await refresh();}
document.getElementById("loginBtn").onclick=doLogin;
document.getElementById("refresh").onclick=refresh;
document.getElementById("logout").onclick=()=>{token="";localStorage.removeItem("eon_admin_token");location.reload();};
if(token){showPanel();}
</script>
</body>
</html>
